# joripspace-workflow-version: 7
name: JoripSpace Deploy

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: "joripspace-uptimejorip"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: |
          rm -rf .joripspace-artifact
          mkdir -p .joripspace-artifact
          runtime_paths=(
            worker.js
            auth.js
          )
          for source in "${runtime_paths[@]}"; do
            [[ -e "$source" ]] || continue
            target=".joripspace-artifact/$source"
            mkdir -p "$(dirname "$target")"
            cp -R "$source" "$target"
          done
      - name: Deploy to JoripSpace
        shell: bash
        env:
          JORIPSPACE_PROJECT_ID: "uptimejorip"
          JORIPSPACE_ARTIFACT_PATH: ".joripspace-artifact"
          JORIPSPACE_ENTRYPOINT: "worker.js"
          JORIPSPACE_API_URL: "https://api.joripspace.com"
        run: |
          set -euo pipefail
          source_dir="$JORIPSPACE_ARTIFACT_PATH"
          if [[ ! -d "$source_dir" ]]; then
            echo "JoripSpace artifact directory does not exist: $source_dir" >&2
            exit 1
          fi
          stage_dir="$RUNNER_TEMP/joripspace-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive_path="$RUNNER_TEMP/joripspace-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.zip"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          cp -R "$source_dir"/. "$stage_dir"/
          npm ci --ignore-scripts
          JORIPSPACE_STAGE_DIR="$stage_dir" JORIPSPACE_ARCHIVE_PATH="$archive_path" node --input-type=module <<'JORIPSPACE_ZIP'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import { join, relative } from "node:path";
          import { zipSync } from "fflate";

          const root = process.env.JORIPSPACE_STAGE_DIR;
          const files = {};
          async function collect(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const full = join(directory, entry.name);
              if (entry.isDirectory()) await collect(full);
              else if (entry.isFile()) files[relative(root, full).replaceAll("\\", "/")] = [await readFile(full), { level: 6 }];
            }
          }
          await collect(root);
          await writeFile(process.env.JORIPSPACE_ARCHIVE_PATH, zipSync(files, { level: 6 }));
          JORIPSPACE_ZIP
          JORIPSPACE_ARCHIVE_PATH="$archive_path" node --input-type=module <<'JORIPSPACE_SCRIPT'
          async function inlineDeployMain() {
            const { open } = await import("node:fs/promises");
            const audience = "https://api.joripspace.com/v1/external-builds/github";
            const projectId = requiredEnv("JORIPSPACE_PROJECT_ID");
            const archivePath = requiredEnv("JORIPSPACE_ARCHIVE_PATH");
            const apiUrl = requiredEnv("JORIPSPACE_API_URL").replace(/\/+$/, "");
            const oidcToken = await requestOidcToken();
            const checkpointOverride = process.env.JORIPSPACE_CHECKPOINT_ID || "";
            const create2 = checkpointOverride
              ? { checkpoint_id: checkpointOverride }
              : await api(`/v1/projects/${encodeURIComponent(projectId)}/checkpoint-uploads`, {
                  method: "POST",
                  token: oidcToken,
                  json: { source_type: "deployment" }
                });
            let checkpointId = create2.checkpoint_id || checkpointOverride;
            if (!checkpointOverride) {
              const file = await open(archivePath, "r");
              try {
                const chunkSize = Number(create2.chunk_size || 8 * 1024 * 1024);
                const buffer = Buffer.alloc(chunkSize);
                let partNumber = 1;
                let position = 0;
                while (true) {
                  const { bytesRead } = await file.read(buffer, 0, buffer.length, position);
                  if (bytesRead === 0) break;
                  const partPath = String(create2.upload_part_url_template).replace("{part_number}", String(partNumber));
                  await api(partPath, {
                    method: "PUT",
                    token: oidcToken,
                    body: buffer.subarray(0, bytesRead),
                    contentType: "application/octet-stream"
                  });
                  position += bytesRead;
                  partNumber += 1;
                }
                if (position === 0) throw new Error("Build artifact ZIP is empty.");
              } finally {
                await file.close();
              }
              const completed = await api(create2.complete_url, { method: "POST", token: oidcToken, json: {} });
              if (completed?.error?.code) throw apiError(completed.status || 400, completed);
              checkpointId = completed.checkpoint_id || completed.id || checkpointId;
            }
            if (!checkpointId) throw new Error("JoripSpace checkpoint id was not returned.");
            const deployPath = `/v1/projects/${encodeURIComponent(projectId)}/checkpoints/${encodeURIComponent(checkpointId)}/deploy`;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const deployToken = await requestOidcToken();
              const result = await api(deployPath, {
                    method: "POST",
                    token: deployToken,
                    json: {},
                    allowedStatuses: [404, 409]
              });
              if (!result.__retry) {
                process.stdout.write(
                  `JoripSpace deployment succeeded: ${result.url || result.default_url || result.deployment_id || projectId}
          `
                );
                return;
              }
                  if (!["checkpoint_not_found", "checkpoint_not_ready", "external_build_deploy_busy"].includes(
                result.error?.code
              )) {
                throw apiError(result.__status, result);
              }
              await new Promise((resolve) => setTimeout(resolve, 2e3));
            }
            throw new Error("JoripSpace artifact processing did not finish within 60 seconds.");
            async function requestOidcToken() {
              const requestUrl = requiredEnv("ACTIONS_ID_TOKEN_REQUEST_URL");
              const requestToken = requiredEnv("ACTIONS_ID_TOKEN_REQUEST_TOKEN");
              const separator = requestUrl.includes("?") ? "&" : "?";
              const response = await fetch(`${requestUrl}${separator}audience=${encodeURIComponent(audience)}`, {
                headers: { Authorization: `Bearer ${requestToken}` }
              });
              const payload = await response.json().catch(() => ({}));
              if (!response.ok || typeof payload.value !== "string") {
                throw new Error(`GitHub OIDC token request failed (${response.status}).`);
              }
              return payload.value;
            }
            __name(requestOidcToken, "requestOidcToken");
            async function api(path, options) {
              const url = path.startsWith("http") ? path : `${apiUrl}${path}`;
              const headers = new Headers({
                Authorization: `Bearer ${options.token}`,
                Accept: "application/json"
              });
              let body = options.body;
              if (options.json !== void 0) {
                headers.set("Content-Type", "application/json");
                body = JSON.stringify(options.json);
              } else if (options.contentType) {
                headers.set("Content-Type", options.contentType);
              }
              const response = await fetch(url, { method: options.method, headers, body });
              const text3 = await response.text();
              const payload = text3 ? safeJson(text3) : {};
              if (response.ok) return payload;
              if ((options.allowedStatuses || []).includes(response.status)) {
                return { ...payload, __retry: true, __status: response.status };
              }
              throw apiError(response.status, payload);
            }
            __name(api, "api");
            function apiError(status, payload) {
              const error = new Error(payload?.error?.message || `JoripSpace request failed (${status}).`);
              error.code = payload?.error?.code || "joripspace_request_failed";
              return error;
            }
            __name(apiError, "apiError");
            function safeJson(value) {
              try {
                return JSON.parse(value);
              } catch {
                return { error: { code: "invalid_response", message: value.slice(0, 500) } };
              }
            }
            __name(safeJson, "safeJson");
            function requiredEnv(name) {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is required.`);
              return value;
            }
            __name(requiredEnv, "requiredEnv");
          }
          
          await inlineDeployMain().catch((error) => {
            const code = error?.code || "joripspace_deploy_failed";
            const message = String(error?.message || "JoripSpace deployment failed.").replace(/[\r\n]+/g, " ").slice(0, 300);
            console.error(`::error title=JoripSpace ${code}::${message}`);
            throw error;
          });
          JORIPSPACE_SCRIPT
